<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Inner Decorative Border -->
  <rect x="24" y="24" width="464" height="464" rx="92" fill="none" stroke="url(#gold)" stroke-width="4" stroke-opacity="0.4" />

  <!-- Keyboard Baseplate Frame -->
  <g filter="url(#shadow)">
    <rect x="76" y="110" width="360" height="250" rx="28" fill="#1e293b" stroke="#334155" stroke-width="5" />
    
    <!-- Top Display Header Bar inside Keyboard -->
    <rect x="100" y="132" width="312" height="38" rx="8" fill="#0f172a" />
    <circle cx="120" cy="151" r="5" fill="#ef4444" />
    <circle cx="136" cy="151" r="5" fill="#f59e0b" />
    <circle cx="152" cy="151" r="5" fill="#10b981" />
    <text x="256" y="157" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="1.5">RSSB LDC DEVLYS 010</text>

    <!-- Keycaps Row 1 -->
    <rect x="100" y="184" width="44" height="38" rx="6" fill="#3b82f6" />
    <text x="122" y="209" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">क</text>

    <rect x="152" y="184" width="44" height="38" rx="6" fill="#ffffff" />
    <text x="174" y="209" fill="#1e293b" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">र</text>

    <rect x="204" y="184" width="44" height="38" rx="6" fill="#ffffff" />
    <text x="226" y="209" fill="#1e293b" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">म</text>

    <rect x="256" y="184" width="44" height="38" rx="6" fill="#ffffff" />
    <text x="278" y="209" fill="#1e293b" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">ा</text>

    <rect x="308" y="184" width="44" height="38" rx="6" fill="#ffffff" />
    <text x="330" y="209" fill="#1e293b" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">त</text>

    <rect x="360" y="184" width="52" height="38" rx="6" fill="#64748b" />
    <text x="386" y="208" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">ENTER</text>

    <!-- Keycaps Row 2 -->
    <rect x="100" y="232" width="58" height="38" rx="6" fill="#64748b" />
    <text x="129" y="256" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">SHIFT</text>

    <rect x="166" y="232" width="44" height="38" rx="6" fill="#fbbf24" />
    <text x="188" y="257" fill="#78350f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">क्र</text>

    <rect x="218" y="232" width="44" height="38" rx="6" fill="#ffffff" />
    <text x="240" y="257" fill="#1e293b" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">स</text>

    <rect x="270" y="232" width="44" height="38" rx="6" fill="#ffffff" />
    <text x="292" y="257" fill="#1e293b" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">य</text>

    <rect x="322" y="232" width="90" height="38" rx="6" fill="#10b981" />
    <text x="367" y="256" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">MS WORD</text>

    <!-- Keycaps Row 3 (Spacebar & Modifiers) -->
    <rect x="100" y="280" width="50" height="38" rx="6" fill="#475569" />
    <text x="125" y="304" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">CTRL</text>

    <rect x="158" y="280" width="196" height="38" rx="6" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1" />
    <text x="256" y="304" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" letter-spacing="2">SPACEBAR</text>

    <rect x="362" y="280" width="50" height="38" rx="6" fill="#475569" />
    <text x="387" y="304" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">ALT</text>
  </g>

  <!-- Bottom Badge: Official 100 Marks Exam Simulation -->
  <rect x="116" y="385" width="280" height="42" rx="21" fill="url(#gold)" filter="url(#shadow)" />
  <text x="256" y="412" fill="#78350f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="900" text-anchor="middle" letter-spacing="0.5">★ 100 MARKS SIMULATOR ★</text>
</svg>
